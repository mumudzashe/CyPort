name: Build CyPort IPA
on:
  workflow_dispatch: # Allows you to trigger the build manually

jobs:
  build:
    runs-on: macos-latest # Triggers a cloud-hosted macOS server
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Run CyPort Build Script
        run: |
          # 1. Create the binary and framework folder layouts
          mkdir -p dummy_game/Cyberpunk2077.app/Contents/MacOS
          mkdir -p dummy_game/Cyberpunk2077.app/Contents/Frameworks
          
          # 2. Compile the structural stub binary
          echo 'print("stub")' > stub.swift
          swiftc stub.swift -target arm64-apple-macos14 -o dummy_game/Cyberpunk2077.app/Contents/MacOS/Cyberpunk2077
          
          # 3. Create a dummy framework file to satisfy the python glob search (*.dylib)
          cp dummy_game/Cyberpunk2077.app/Contents/MacOS/Cyberpunk2077 dummy_game/Cyberpunk2077.app/Contents/Frameworks/stub.dylib
          
          chmod +x ./build.sh
          
          # 4. Execute the builder
          GAME_APP="dummy_game/Cyberpunk2077.app" REBUILD_SHIM=1 ./build.sh






      - name: Upload Finished IPA
        uses: actions/upload-artifact@v4
        with:
          name: CyPort-Unsigned-IPA
          path: build/CyPort-unsigned.ipa
